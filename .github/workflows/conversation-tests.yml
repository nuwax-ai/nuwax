# 会话行为与测试变更运行 test:conversation；页面 E2E 按测试策略执行。
name: conversation-tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/models/conversation*'
      - 'src/models/conversationInfoMessageList*'
      - 'src/features/conversation/**'
      - 'src/components/business-component/UnifiedChatSession/**'
      - 'src/components/business-component/MessageQueue/**'
      - 'src/components/business-component/AgentIntervention/**'
      - 'src/components/ChatInputHome/**'
      - 'src/pages/Chat/**'
      - 'src/pages/ConversationAgent/**'
      - 'src/pages/EditAgent/PreviewAndDebug/**'
      - 'src/pages/SpacePluginTool/components/PluginChatSession/**'
      - 'src/utils/conversation*'
      - 'src/utils/eventBus*'
      - 'tests/**'
      - 'scripts/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/conversation-tests.yml'
  pull_request:
    paths:
      - 'src/models/conversation*'
      - 'src/models/conversationInfoMessageList*'
      - 'src/features/conversation/**'
      - 'src/components/business-component/UnifiedChatSession/**'
      - 'src/components/business-component/MessageQueue/**'
      - 'src/components/business-component/AgentIntervention/**'
      - 'src/components/ChatInputHome/**'
      - 'src/pages/Chat/**'
      - 'src/pages/ConversationAgent/**'
      - 'src/pages/EditAgent/PreviewAndDebug/**'
      - 'src/pages/SpacePluginTool/components/PluginChatSession/**'
      - 'src/utils/conversation*'
      - 'src/utils/eventBus*'
      - 'tests/**'
      - 'scripts/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/conversation-tests.yml'

jobs:
  conversation-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run conversation contract tests
        run: npm run test:conversation
