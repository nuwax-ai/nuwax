# 会话模块合同网 CI（docs/conversation/conversation-maintenance-guide.md §1）
#
# 作用：PR / push 涉及会话相关路径时自动跑 `npm run test:conversation`
#      （33 文件 ~292 条，秒级，无浏览器/登录态依赖），失败即阻断合入。
# 真实页面 E2E（e2e:conversation）需要 dev server 与登录态，不进 CI，
# 按 CLAUDE.md 约定在本地 / 发版前执行。
#
# 注：仓库托管在 gitee。gitee 的 Gitee Go 与 Jenkins 均可直接照抄本文件的
# 三个步骤（checkout → pnpm install → npm run test:conversation）；
# 若使用 GitHub 亦即开即用。

name: conversation-tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/models/conversation*'
      - 'src/models/conversationInfoMessageList*'
      - 'src/features/conversation/**'
      - 'src/components/business-component/UnifiedChatSession/**'
      - 'src/components/business-component/MessageQueue/**'
      - 'src/components/business-component/AgentIntervention/**'
      - 'src/components/ChatInputHome/**'
      - 'src/pages/Chat/**'
      - 'src/pages/ConversationAgent/**'
      - 'src/pages/EditAgent/PreviewAndDebug/**'
      - 'src/pages/SpacePluginTool/components/PluginChatSession/**'
      - 'src/utils/conversation*'
      - 'src/utils/eventBus*'
      - 'tests/**'
      - 'scripts/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/conversation-tests.yml'
  pull_request:
    paths:
      - 'src/models/conversation*'
      - 'src/models/conversationInfoMessageList*'
      - 'src/features/conversation/**'
      - 'src/components/business-component/UnifiedChatSession/**'
      - 'src/components/business-component/MessageQueue/**'
      - 'src/components/business-component/AgentIntervention/**'
      - 'src/components/ChatInputHome/**'
      - 'src/pages/Chat/**'
      - 'src/pages/ConversationAgent/**'
      - 'src/pages/EditAgent/PreviewAndDebug/**'
      - 'src/pages/SpacePluginTool/components/PluginChatSession/**'
      - 'src/utils/conversation*'
      - 'src/utils/eventBus*'
      - 'tests/**'
      - 'scripts/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/conversation-tests.yml'

jobs:
  conversation-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run conversation contract tests
        run: npm run test:conversation

# ── mock 场景 E2E 接入说明（M3，独立决策点）──────────────────────────────
# e2e:mock-chat 无登录态依赖，进 CI 仅需 dev server（~2min 首编）：
#   1. Install 后台起 dev server：nohup npm run dev >/tmp/dev.log 2>&1 &
#      并轮询 curl http://localhost:3000/api/mock/conversation/scenarios 至就绪
#   2. 安装 ego-browser（npm i -g ego-browser，需图形环境或 headless 方案）
#   3. npm run e2e:mock-chat（exit 0/1 可直接作门禁；断言型 33 场景 × 双轨 +
#      交互型 5 用例 × 双轨，日常约 8~12min；E2E_REAL_TIMING=1 真实时长子集
#      仅发版前本地跑，勿进日常 CI）
# gitee Go / Jenkins 照抄这三步即可（scripts/e2e/ego-run.mjs 负责 env 桥接）。
# 待 mock E2E 稳定运行若干轮后再评估正式接入本 workflow。
