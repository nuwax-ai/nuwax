name: frontend type domains

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/check-types*'
      - 'typecheck-*.json'
      - 'tsconfig*.json'
      - '.umirc*.ts'
      - 'config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/typecheck.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/check-types*'
      - 'typecheck-*.json'
      - 'tsconfig*.json'
      - '.umirc*.ts'
      - 'config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/typecheck.yml'

permissions:
  contents: read

concurrency:
  group: type-domains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # postinstall 的 max setup 生成 .umi 配置/类型；不运行 dev/build 版本及微应用 hooks。
      - name: Install dependencies and generate Umi types
        run: pnpm install --frozen-lockfile
      - name: Test type gate
        run: pnpm test:typecheck
      - name: Check type domains
        run: pnpm typecheck
