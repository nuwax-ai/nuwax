<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>女娲</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #f6f7f9; color: #1f2329; }
    .shell { display: none; flex-direction: column; height: 100%; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: #fff; box-shadow: 0 4px 12px rgba(31, 35, 41, 0.12); position: relative; z-index: 2; }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-icon { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; }
    .brand-name { font-size: 16px; font-weight: 600; line-height: 22px; color: #1f2329; }
    a.pill { flex-shrink: 0; padding: 6px 14px; border-radius: 16px; background: #5b4dff; color: #fff; font-size: 14px; line-height: 20px; text-decoration: none; }
    .frame { flex: 1; width: 100%; border: 0; background: #fff; }
    .card { margin: 24px 16px; padding: 20px; background: #fff; border-radius: 12px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #4e5969; }
    button, a.btn { display: block; width: 100%; margin-top: 16px; padding: 12px 0; border: 0; border-radius: 8px; background: #5b4dff; color: #fff; font-size: 16px; text-align: center; text-decoration: none; }
    .mask { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.72); }
    .mask-arrow { position: absolute; top: 4px; right: 8px; width: 108px; height: 148px; }
    .mask-tip { position: absolute; top: 168px; left: 12px; right: 12px; margin: 0; color: #fff; font-size: 16px; font-weight: 600; line-height: 1.4; text-align: center; white-space: nowrap; }
    .mask-dot { display: inline-block; width: 22px; height: 22px; margin: 0 4px; border: 2px solid #fff; border-radius: 50%; vertical-align: -5px; position: relative; }
    .mask-dot::before { content: ""; position: absolute; left: 3px; top: 7px; width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: 6px 0 0 #fff, 12px 0 0 #fff; }
    .mask-em { color: #ffe14a; }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <div class="bar">
      <div class="brand">
        <img class="brand-icon" src="logo.png" alt="" />
        <span class="brand-name">女娲 Nuwax</span>
      </div>
      <a class="pill" id="open-bar" href="#">打开 App</a>
    </div>
    <iframe class="frame" id="frame" title="分享内容"></iframe>
  </div>
  <div class="card" id="card">
    <h1 id="title">女娲</h1>
    <p id="desc">在浏览器中打开后，可直接进入女娲 App。</p>
    <a class="btn" id="open" href="#">打开女娲 App</a>
  </div>
  <div class="mask" id="mask">
    <svg class="mask-arrow" viewBox="0 0 108 148" fill="none" aria-hidden="true">
      <path d="M28 138 C34 86 58 62 92 18" stroke="#ffe14a" stroke-width="5" stroke-linecap="round"/>
      <path d="M70 22 L96 10 L86 38" stroke="#ffe14a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="mask-tip">点击右上角<span class="mask-dot"></span>选择<span class="mask-em">浏览器打开</span></p>
  </div>
  <script>
    var q = new URLSearchParams(location.search);
    var kind = q.get("kind") || "";
    var title = q.get("title") || "女娲";
    var id = q.get("id") || "";
    var sk = q.get("sk") || "";
    var text = q.get("text") || "";
    var pageUrl = q.get("to") || q.get("url") || "";
    document.title = title;
    var scheme = "nuwax://open?kind=" + encodeURIComponent(kind)
      + "&id=" + encodeURIComponent(id)
      + "&title=" + encodeURIComponent(title)
      + "&sk=" + encodeURIComponent(sk)
      + "&text=" + encodeURIComponent(text);
    function httpUrl(value) {
      var lower = (value || "").toLowerCase();
      if (lower.indexOf("https://") === 0 || lower.indexOf("http://") === 0) return value;
      return "";
    }
    var contentUrl = httpUrl(pageUrl);
    if (!contentUrl && sk) {
      contentUrl = location.origin + "/static/file-preview.html?sk=" + encodeURIComponent(sk);
    }
    if (contentUrl) {
      scheme += "&url=" + encodeURIComponent(contentUrl);
    }
    var mask = document.getElementById("mask");
    var inWechat = /MicroMessenger/i.test(navigator.userAgent);
    function bindOpen(el) {
      if (!el) return;
      if (inWechat) {
        el.href = "#";
        el.addEventListener("click", function (event) {
          event.preventDefault();
          mask.style.display = "block";
        });
        return;
      }
      el.href = scheme;
      // App 还没被唤起时，连点只保留第一次。回到本页后可以再点。
      var opening = false;
      var openTimer = 0;
      var beginOpen = function (event) {
        if (opening) {
          event.preventDefault();
          return;
        }
        opening = true;
        el.href = scheme + "&n=" + Date.now();
        clearTimeout(openTimer);
        openTimer = setTimeout(function () {
          if (document.visibilityState === "visible") opening = false;
        }, 1500);
      };
      el.addEventListener("click", beginOpen);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") opening = false;
      });
    }
    mask.addEventListener("click", function () {
      mask.style.display = "none";
    });
    if (contentUrl) {
      document.getElementById("frame").src = contentUrl;
      document.getElementById("shell").style.display = "flex";
      document.getElementById("card").style.display = "none";
      bindOpen(document.getElementById("open-bar"));
    } else {
      document.getElementById("title").textContent = title;
      var desc = "打开女娲查看这条内容。未安装时留在本页即可浏览摘要。";
      if (kind === "agent") desc = "这是一个女娲智能体。安装 App 后可直接进入；未安装可继续用浏览器访问。";
      if (kind === "file") desc = "这是一份分享文件。";
      if (kind === "message") desc = text || "这是一条会话摘要。";
      document.getElementById("desc").textContent = desc;
      bindOpen(document.getElementById("open"));
    }
  </script>
</body>
</html>
