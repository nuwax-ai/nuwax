<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>女娲</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #f6f7f9; color: #1f2329; }
    .card { margin: 24px 16px; padding: 20px; background: #fff; border-radius: 12px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #4e5969; }
    button, a.btn { display: block; width: 100%; margin-top: 16px; padding: 12px 0; border: 0; border-radius: 8px; background: #5b4dff; color: #fff; font-size: 16px; text-align: center; text-decoration: none; }
    .hint { margin-top: 12px; font-size: 13px; color: #86909c; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">女娲</h1>
    <p id="desc">在浏览器中打开后，可直接进入女娲 App。</p>
    <p id="wechat" class="hint" style="display:none">当前在微信内无法直接打开 App。请点右上角「···」，选择「在浏览器中打开」。</p>
    <a class="btn" id="open" href="#" style="display:none">打开女娲 App</a>
  </div>
  <script>
    var q = new URLSearchParams(location.search);
    var kind = q.get("kind") || "";
    var title = q.get("title") || "女娲";
    var id = q.get("id") || "";
    var sk = q.get("sk") || "";
    var text = q.get("text") || "";
    document.getElementById("title").textContent = title;
    var desc = "打开女娲查看这条内容。未安装时留在本页即可浏览摘要。";
    if (kind === "agent") desc = "这是一个女娲智能体。安装 App 后可直接进入；未安装可继续用浏览器访问。";
    if (kind === "file") desc = "这是一份分享文件。";
    if (kind === "message") desc = text || "这是一条会话摘要。";
    document.getElementById("desc").textContent = desc;
    var scheme = "nuwax://open?kind=" + encodeURIComponent(kind)
      + "&id=" + encodeURIComponent(id)
      + "&title=" + encodeURIComponent(title)
      + "&sk=" + encodeURIComponent(sk)
      + "&text=" + encodeURIComponent(text);
    var open = document.getElementById("open");
    open.href = scheme;
    var inWechat = /MicroMessenger/i.test(navigator.userAgent);
    if (inWechat) {
      document.getElementById("wechat").style.display = "block";
    } else {
      open.style.display = "block";
      setTimeout(function () { location.href = scheme; }, 300);
    }
    if (kind === "file" && sk) {
      var fileLink = document.createElement("a");
      fileLink.className = "btn";
      fileLink.style.background = "#fff";
      fileLink.style.color = "#5b4dff";
      fileLink.style.border = "1px solid #5b4dff";
      fileLink.textContent = "在浏览器中预览文件";
      fileLink.href = location.origin + "/static/file-preview.html?sk=" + encodeURIComponent(sk);
      document.querySelector(".card").appendChild(fileLink);
    }
  </script>
</body>
</html>
