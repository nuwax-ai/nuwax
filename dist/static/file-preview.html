<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Document Preview</title>

    <!-- Local library styles -->
    <link rel="stylesheet" href="/libs/js-preview/docx.css">
    <link rel="stylesheet" href="/libs/js-preview/excel.css">
    <link rel="stylesheet" href="/libs/js-preview/github.min.css">
    <!-- Local styles -->
    <link rel="stylesheet" href="/libs/js-preview/file-preview.css">

</head>

<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text"></div>
    </div>

    <!-- Error Overlay -->
    <div id="errorOverlay" class="error-overlay hidden">
        <div id="errorIcon" class="error-icon"></div>
        <div id="errorText" class="error-text"></div>
        <div class="error-actions">
            <button class="retry-action-btn" onclick="startPreview()">Retry</button>
            <button id="errorDownloadBtn" class="download-action-btn hidden" onclick="downloadFile()">Download</button>
        </div>
    </div>

    <!-- Preview Container -->
    <div id="previewContainer" class="preview-container"></div>

    <!-- Float Download Button (Hidden by default) -->
    <button id="previewDownloadBtn" class="preview-download-btn hidden" onclick="downloadFile()" title="Download File">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
    </button>

    <!-- 官方 uni.webview JSSDK（全站唯一副本 /static/uni.webview.1.5.5.js），无条件加载。
         仅 notifyParent 在顶层 webview（App）经 uni.webView.postMessage 把 OPENUI_ACTION 桥接到 @message。 -->
    <script src="/static/uni.webview.1.5.5.js"></script>
    <!-- 改脚本后请 bump ?v=，避免 CDN/浏览器缓存旧文件 -->
    <script src="file-preview/file-preview-utils.js?v=2026.8.2"></script>
    <script src="file-preview/file-preview-openui.js?v=2026.8.2"></script>
    <script src="file-preview/file-preview.js?v=2026.8.2"></script>
</body>

</html>
