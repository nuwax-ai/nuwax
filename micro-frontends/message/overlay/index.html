<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- DEV-405：第三方 CDN 语音/视频 Referer 防盗链——audio/video 不支持元素级
         referrerpolicy，页面级 same-origin（同源发完整、跨域不发）随上游同步；
         取 no-referrer 会剥掉同源 /api/** Referer（见上游 index.html 纪律注释）。 -->
    <meta name="referrer" content="same-origin" />
    <title>Nuwax IM</title>
    <style>
      /* 启动骨架仅属于消息根，不改宿主的 html/body 或同名 root。 */
      [data-message-app-scope] {
        position: relative;
        width: 100%;
        height: 100vh;
        font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1f2329;
      }
      [data-message-app-scope] *,
      [data-message-app-scope] {
        box-sizing: border-box;
      }
      [data-message-app-scope] #boot-skeleton {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      [data-message-app-scope] .chat-layout {
        display: flex;
        height: 100%;
      }
      [data-message-app-scope] .conv-pane {
        width: 250px;
        min-width: 200px;
        background: #fafafa;
        border-right: 1px solid #e4e6ea;
      }
      [data-message-app-scope] .chat-pane {
        flex: 1;
        min-width: 0;
        background: #fcfcfc;
      }
    </style>
  </head>
  <body>
    <div id="root" data-message-app-scope>
      <div id="boot-skeleton" aria-hidden="true">
        <div class="chat-layout">
          <div class="conv-pane"></div>
          <div class="chat-pane"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
