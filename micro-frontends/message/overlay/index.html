<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- DEV-405：第三方 CDN 语音/视频 Referer 防盗链——audio/video 不支持元素级
         referrerpolicy，页面级 same-origin（同源发完整、跨域不发）随上游同步；
         取 no-referrer 会剥掉同源 /api/** Referer（见上游 index.html 纪律注释）。 -->
    <meta name="referrer" content="same-origin" />
    <title>Nuwax IM</title>
    <style>
      /* 启动骨架仅属于消息根，不改宿主的 html/body 或同名 root。 */
      [data-message-app-scope] {
        position: relative;
        width: 100%;
        height: 100vh;
        font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1f2329;
      }
      [data-message-app-scope] *,
      [data-message-app-scope] {
        box-sizing: border-box;
      }
      [data-message-app-scope] #boot-skeleton {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      [data-message-app-scope] .chat-layout {
        display: flex;
        height: 100%;
      }
      /* 兜底宽度与远端 index.html / styles.css 一致（2026-11-09 起为 300）。 */
      [data-message-app-scope] .conv-pane {
        width: var(--conv-pane-width, 300px);
        min-width: 250px;
        background: #fafafa;
        border-right: 1px solid #e4e6ea;
      }
      [data-message-app-scope] .chat-pane {
        flex: 1;
        min-width: 0;
        background: #fcfcfc;
      }
    </style>
  </head>
  <body>
    <!--
      来电铃声预取，与上游 index.html 的 #boot-ringtone 同一份元素。
      ringtone.ts 按这个 id 接管它；放在 #root 外，避免宿主骨架和 React 挂载时把它清掉。
      %BASE_URL% 由 Vite 换成微应用 base，不要写成绝对路径。
    -->
    <audio
      id="boot-ringtone"
      src="%BASE_URL%ringtones/ringtone.m4a"
      preload="auto"
      loop
      aria-hidden="true"
    ></audio>
    <div id="root" data-message-app-scope>
      <!--
        与远端 index.html 同一组边界（MIN 250 / MAX 600 / CHAT_MIN 360）。
        变量写在消息根上，不改宿主 documentElement。
      -->
      <script>
        (function () {
          try {
            var root = document.currentScript && document.currentScript.parentElement;
            if (!root) return;
            var saved = Number(localStorage.getItem('nuwax-im:conv-width'));
            if (!isFinite(saved)) return;
            var MIN = 250, MAX = 600, CHAT_MIN = 360;
            var upper = Math.min(MAX, Math.floor(window.innerWidth - CHAT_MIN));
            if (upper < MIN) return;
            var width = Math.max(MIN, Math.min(upper, Math.round(saved)));
            root.style.setProperty('--conv-pane-width', width + 'px');
          } catch (e) {
            /* 隐私模式或存储被禁用：保持 CSS 兜底的 300。 */
          }
        })();
      </script>
      <div id="boot-skeleton" aria-hidden="true">
        <div class="chat-layout">
          <div class="conv-pane"></div>
          <div class="chat-pane"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
