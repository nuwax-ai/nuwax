<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenUI iframe probe</title>
  </head>
  <body>
    <p id="status">iframe classic script pending</p>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var nonce = params.get('nonce') || '';
        document.getElementById('status').textContent =
          'iframe classic script executed';
        window.parent.postMessage(
          {
            type: 'OPENUI_DEBUG_FRAME_CLASSIC',
            nonce: nonce,
            href: window.location.href,
          },
          '*',
        );
        window.addEventListener('message', function (event) {
          if (
            event.source === window.parent &&
            event.data &&
            event.data.type === 'OPENUI_DEBUG_PARENT_PING' &&
            event.data.nonce === nonce
          ) {
            window.parent.postMessage(
              { type: 'OPENUI_DEBUG_FRAME_PONG', nonce: nonce },
              '*',
            );
          }
        });
      })();
    </script>
    <script type="module">
      const nonce = new URLSearchParams(window.location.search).get('nonce') || '';
      document.getElementById('status').textContent += ' / module script executed';
      window.parent.postMessage(
        { type: 'OPENUI_DEBUG_FRAME_MODULE', nonce },
        '*',
      );
    </script>
  </body>
</html>
