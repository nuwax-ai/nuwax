<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>OpenUI 小程序诊断</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 14px; color: #172033; background: #f4f6fa; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .hint { margin: 0 0 12px; color: #667085; }
      .card { margin-bottom: 12px; padding: 12px; border: 1px solid #d9deea; border-radius: 10px; background: #fff; }
      .card h2 { margin: 0 0 8px; font-size: 16px; }
      .row { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; border-bottom: 1px solid #eef1f6; }
      .row:last-child { border-bottom: 0; }
      .badge { min-width: 48px; padding: 1px 7px; border-radius: 99px; text-align: center; font-size: 12px; color: #fff; background: #98a2b3; }
      .pass { background: #12a150; }
      .fail { background: #d92d20; }
      .warn { background: #dc8b00; }
      .detail { min-width: 0; overflow-wrap: anywhere; }
      button { margin: 4px 6px 4px 0; padding: 8px 10px; border: 0; border-radius: 7px; color: #fff; background: #315cec; }
      button.secondary { background: #b54708; }
      iframe { display: block; width: 100%; border: 1px solid #ccd3e0; border-radius: 8px; background: #fff; }
      #probeFrame { height: 72px; }
      #runtimeFrame { height: 440px; }
      pre { max-height: 280px; margin: 0; padding: 10px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 8px; color: #d6e2ff; background: #101828; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <h1>OpenUI 小程序诊断</h1>
    <p class="hint">逐项检测 WebView、嵌套 iframe、模块脚本、消息桥、Web Crypto 与 Runtime。</p>

    <section class="card">
      <h2>环境能力</h2>
      <div id="checks"></div>
    </section>

    <section class="card">
      <h2>嵌套 iframe 探针</h2>
      <div id="frameChecks"></div>
      <iframe id="probeFrame" title="iframe probe" sandbox="allow-scripts allow-same-origin"></iframe>
    </section>

    <section class="card">
      <h2>真实 OpenUI Runtime</h2>
      <div id="runtimeChecks"></div>
      <button id="strictLoad" type="button">严格校验并加载</button>
      <button id="bypassLoad" class="secondary" type="button">仅诊断：绕过摘要校验加载</button>
      <iframe id="runtimeFrame" title="OpenUI Runtime" sandbox="allow-scripts allow-same-origin"></iframe>
    </section>

    <section class="card">
      <h2>事件日志</h2>
      <pre id="log"></pre>
    </section>

    <script src="/static/openui-crypto-compat.js?v=2026.8.3"></script>
    <script>
      (function () {
        'use strict';

        var PROTOCOL = 'nuwax.openui-runtime/v1';
        var params = new URLSearchParams(window.location.search);
        var probeNonce = crypto.randomUUID();
        var runtimeNonce = crypto.randomUUID();
        var artifact = null;
        var runtimeReady = false;
        var strictRequested = true;
        var logNode = document.getElementById('log');
        var probeFrame = document.getElementById('probeFrame');
        var runtimeFrame = document.getElementById('runtimeFrame');

        function text(value) {
          if (value instanceof Error) return value.message;
          if (typeof value === 'string') return value;
          try { return JSON.stringify(value); } catch (error) { return String(value); }
        }

        function log(label, value) {
          var line = new Date().toISOString().slice(11, 23) + ' ' + label;
          if (arguments.length > 1) line += ' ' + text(value);
          logNode.textContent += line + '\n';
          logNode.scrollTop = logNode.scrollHeight;
        }

        function report(containerId, key, status, detail) {
          var container = document.getElementById(containerId);
          var existing = document.getElementById('check-' + key);
          var row = existing || document.createElement('div');
          row.id = 'check-' + key;
          row.className = 'row';
          row.innerHTML = '';
          var badge = document.createElement('span');
          badge.className = 'badge ' + status;
          badge.textContent = status === 'pass' ? '通过' : status === 'fail' ? '失败' : '等待';
          var content = document.createElement('div');
          content.className = 'detail';
          content.textContent = detail;
          row.appendChild(badge);
          row.appendChild(content);
          if (!existing) container.appendChild(row);
        }

        function addQuery(url, key, value) {
          var separator = url.indexOf('?') >= 0 ? '&' : '?';
          return url + separator + encodeURIComponent(key) + '=' + encodeURIComponent(value);
        }

        function extractFilePath(url) {
          try {
            var parsed = new URL(url, window.location.origin);
            var prefix = '/api/computer/static';
            if (parsed.pathname.indexOf(prefix) !== 0) return null;
            return parsed.pathname.slice(prefix.length) + parsed.search;
          } catch (error) {
            return null;
          }
        }

        function artifactUrl() {
          var url = params.get('fileUrl') || '';
          var ticket = params.get('_ticket');
          var sk = params.get('sk');
          if (ticket) return addQuery(url, '_ticket', ticket);
          if (sk) return addQuery(url, 'sk', sk);
          return url;
        }

        async function sha256(value) {
          if (typeof TextEncoder !== 'function') throw new Error('TextEncoder 不可用');
          if (!crypto.subtle || typeof crypto.subtle.digest !== 'function') {
            throw new Error('crypto.subtle.digest 不可用');
          }
          var bytes = new TextEncoder().encode(value);
          var digest = await crypto.subtle.digest('SHA-256', bytes);
          return 'sha256:' + Array.from(new Uint8Array(digest), function (byte) {
            return byte.toString(16).padStart(2, '0');
          }).join('');
        }

        async function validateArtifact(candidate) {
          if (!candidate || candidate.type !== 'nuwax.openui-file') throw new Error('artifact type 无效');
          if (candidate.schemaVersion !== 'nuwax.openui-file/v1') throw new Error('schemaVersion 无效');
          if (!candidate.document || typeof candidate.document.source !== 'string') throw new Error('document.source 缺失');
          var actual = await sha256(candidate.document.source);
          if (actual !== candidate.document.digest) throw new Error('document.digest 不匹配');
          return candidate;
        }

        function postLoad(mode) {
          if (!artifact) {
            report('runtimeChecks', 'load', 'warn', mode + '加载：尚未收到 artifact');
            return;
          }
          if (!runtimeReady) {
            report('runtimeChecks', 'load', 'warn', mode + '加载：Runtime 尚未发出 OPENUI_READY');
            return;
          }
          runtimeFrame.contentWindow.postMessage({
            type: 'OPENUI_LOAD',
            protocolVersion: PROTOCOL,
            nonce: runtimeNonce,
            artifact: artifact,
            locale: navigator.language || 'zh-CN',
            theme: 'light',
            viewport: 'mobile',
          }, '*');
          report('runtimeChecks', 'load', 'pass', mode + '：已发送 OPENUI_LOAD');
          log('发送 OPENUI_LOAD', mode);
        }

        async function strictLoad() {
          strictRequested = true;
          if (!artifact) return postLoad('严格模式');
          try {
            await validateArtifact(artifact);
            report('runtimeChecks', 'digest', 'pass', 'artifact SHA-256 校验通过');
            postLoad('严格模式');
          } catch (error) {
            report('runtimeChecks', 'digest', 'fail', 'artifact 校验失败：' + text(error));
            log('严格校验失败', error);
          }
        }

        function bypassLoad() {
          strictRequested = false;
          report('runtimeChecks', 'digest', 'warn', '诊断模式已绕过摘要校验（不可用于正式环境）');
          postLoad('绕过校验');
        }

        report('checks', 'userAgent', 'pass', navigator.userAgent);
        report('checks', 'randomUUID', typeof crypto.randomUUID === 'function' ? 'pass' : 'fail', 'crypto.randomUUID: ' + typeof crypto.randomUUID);
        report('checks', 'textEncoder', typeof TextEncoder === 'function' ? 'pass' : 'fail', 'TextEncoder: ' + typeof TextEncoder);
        report('checks', 'subtle', crypto.subtle && typeof crypto.subtle.digest === 'function' ? 'pass' : 'fail', 'crypto.subtle.digest: ' + (crypto.subtle && typeof crypto.subtle.digest));
        report('checks', 'moduleTop', 'warn', '顶层 type=module：等待执行');
        report('frameChecks', 'frameClassic', 'warn', 'iframe classic script：等待');
        report('frameChecks', 'frameModule', 'warn', 'iframe type=module：等待');
        report('frameChecks', 'frameMessage', 'warn', 'iframe postMessage 双向通信：等待');
        report('runtimeChecks', 'artifact', 'warn', 'Runtime 自主拉取 artifact：等待');
        report('runtimeChecks', 'ready', 'warn', 'Runtime type=module / OPENUI_READY：等待');

        sha256('abc').then(function (digest) {
          var expected = 'sha256:ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad';
          report('checks', 'sha256', digest === expected ? 'pass' : 'fail', 'SHA-256("abc"): ' + digest);
        }).catch(function (error) {
          report('checks', 'sha256', 'fail', 'SHA-256 执行失败：' + text(error));
        });

        probeFrame.src = '/static/openui-debug-frame.html?nonce=' + encodeURIComponent(probeNonce);
        probeFrame.addEventListener('load', function () {
          log('probe iframe load');
          probeFrame.contentWindow.postMessage({ type: 'OPENUI_DEBUG_PARENT_PING', nonce: probeNonce }, '*');
        });

        var sourceUrl = artifactUrl();
        var filePath = extractFilePath(sourceUrl);
        if (!sourceUrl) {
          report('runtimeChecks', 'artifact', 'fail', '缺少 fileUrl 参数');
        } else if (!filePath) {
          report('runtimeChecks', 'artifact', 'fail', 'fileUrl 不是 /api/computer/static 路径：' + sourceUrl);
        } else {
          runtimeFrame.src = '/static/file-preview.html?openui=1&nonce=' + encodeURIComponent(runtimeNonce) + '&file_path=' + encodeURIComponent(filePath);
          log('runtime iframe src', runtimeFrame.src);
        }

        window.addEventListener('message', function (event) {
          var data = event.data || {};
          if (event.source === probeFrame.contentWindow && data.nonce === probeNonce) {
            if (data.type === 'OPENUI_DEBUG_FRAME_CLASSIC') {
              report('frameChecks', 'frameClassic', 'pass', 'iframe classic script 已执行');
            } else if (data.type === 'OPENUI_DEBUG_FRAME_MODULE') {
              report('frameChecks', 'frameModule', 'pass', 'iframe type=module 已执行');
            } else if (data.type === 'OPENUI_DEBUG_FRAME_PONG') {
              report('frameChecks', 'frameMessage', 'pass', 'parent ↔ iframe postMessage 双向正常');
            }
            log('probe message', data.type);
            return;
          }
          if (event.source !== runtimeFrame.contentWindow || data.nonce !== runtimeNonce || data.protocolVersion !== PROTOCOL) return;
          log('runtime message', data.type + (data.message ? ': ' + data.message : ''));
          if (data.type === 'OPENUI_FP_ARTIFACT') {
            artifact = data.artifact;
            report('runtimeChecks', 'artifact', 'pass', 'Runtime iframe 拉取 artifact 成功');
            if (strictRequested) strictLoad();
          } else if (data.type === 'OPENUI_FP_ERROR') {
            report('runtimeChecks', 'artifact', 'fail', 'Runtime 拉取失败：' + (data.message || 'unknown'));
          } else if (data.type === 'OPENUI_READY') {
            runtimeReady = true;
            report('runtimeChecks', 'ready', 'pass', 'Runtime 已发出 OPENUI_READY');
            if (artifact) strictRequested ? strictLoad() : bypassLoad();
          } else if (data.type === 'OPENUI_ERROR') {
            report('runtimeChecks', 'render', 'fail', 'Runtime 渲染错误：' + (data.message || 'unknown'));
          } else if (data.type === 'OPENUI_RESIZE') {
            report('runtimeChecks', 'render', 'pass', 'Runtime 已渲染并发出 OPENUI_RESIZE，高度 ' + data.height);
          }
        });

        document.getElementById('strictLoad').addEventListener('click', strictLoad);
        document.getElementById('bypassLoad').addEventListener('click', bypassLoad);

        window.setTimeout(function () {
          if (!runtimeReady) report('runtimeChecks', 'ready', 'fail', '8 秒内未收到 OPENUI_READY（重点检查 type=module/runtime.js）');
        }, 8000);
        window.setTimeout(function () {
          var moduleRow = document.getElementById('check-moduleTop');
          if (moduleRow && moduleRow.querySelector('.warn')) report('checks', 'moduleTop', 'fail', '顶层 type=module 未执行');
          var frameModuleRow = document.getElementById('check-frameModule');
          if (frameModuleRow && frameModuleRow.querySelector('.warn')) report('frameChecks', 'frameModule', 'fail', 'iframe type=module 未执行');
        }, 3000);
      })();
    </script>
    <script type="module">
      const row = document.getElementById('check-moduleTop');
      if (row) {
        row.querySelector('.badge').className = 'badge pass';
        row.querySelector('.badge').textContent = '通过';
        row.querySelector('.detail').textContent = '顶层 type=module 已执行';
      }
    </script>
  </body>
</html>
