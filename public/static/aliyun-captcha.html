<!doctype html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="data-spm" content="5176"/>
        <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
        <script>
            // 将在获取配置后动态设置
            window.AliyunCaptchaConfig = {
                region: 'cn',
                prefix: '',
            };
        </script>
        <script type="text/javascript" src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
        <script src="https://res.wx.qq.com/open/js/jweixin-1.3.2.js"></script>
        <!-- defer 确保 Android WebView 已创建后再初始化 uni-app x 桥接。 -->
        <script defer src="/static/uni.webview.1.5.5.js"></script>

    </head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        
        #captcha-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }

        #captcha-element {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #loading-message,
        #error-message {
            font-size: 14px;
            color: #666;
            text-align: center;
            padding: 20px;
        }

        #error-message {
            color: #ff4d4f;
        }
    </style>

    <body>
        <div id="captcha-container">
            <div id="loading-message">正在加载验证码配置...</div>
            <div id="error-message" style="display: none;"></div>
            <div id="captcha-element"></div>
            <div id="captcha-button"></div>
        </div>

        <script type="text/javascript">
            var captcha;
            var captchaConfig = null;
            var captchaResultHandled = false;

            // 获取验证码配置
            function fetchCaptchaConfig() {
                return fetch('/api/tenant/config', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                })
                .then(function(response) {
                    return response.json();
                })
                .then(function(result) {
                    if (result.code === '0000' && result.data) {
                        return {
                            prefix: result.data.captchaPrefix,
                            sceneId: result.data.captchaSceneId,
                        };
                    } else {
                        throw new Error(result.message || '获取配置失败');
                    }
                })
                .catch(function(error) {
                    console.error('获取验证码配置失败:', error);
                    throw error;
                });
            }

            function initCaptcha(config) {
                // 更新全局配置
                window.AliyunCaptchaConfig.prefix = config.prefix;

                window.initAliyunCaptcha({
                    SceneId: config.sceneId,
                    mode: 'embed',
                    element: '#captcha-element',
                    button: '#captcha-button',
                    success: success,
                    captchaVerifyCallback: captchaVerifyCallback,
                    onBizResultCallback: function() {},
                    fail: fail,
                    getInstance: getInstance,
                    slideStyle: {
                        width: 360,
                        height: 40,
                    },
                    language: 'cn',
                    timeout: 5000,
                });  
            }

            // 初始化流程
            function init() {
                var loadingMessage = document.getElementById('loading-message');
                var errorMessage = document.getElementById('error-message');

                fetchCaptchaConfig()
                    .then(function(config) {
                        captchaConfig = config;
                        loadingMessage.style.display = 'none';
                        initCaptcha(config);
                    })
                    .catch(function(error) {
                        loadingMessage.style.display = 'none';
                        errorMessage.textContent = '加载验证码配置失败: ' + error.message;
                        errorMessage.style.display = 'block';
                    });
            }

            // 页面加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            function getInstance(instance) {
                console.log(instance)
                captcha = instance;
            }

            function showBridgeStatus(message, isError) {
                var messageElement = document.getElementById('error-message');
                messageElement.textContent = message;
                messageElement.style.color = isError ? '#ff4d4f' : '#666';
                messageElement.style.display = 'block';
            }

            function postCaptchaVerifyParamToApp(captchaVerifyParam, retryCount) {
                var currentRetryCount = retryCount || 0;
                if (window.uni && window.uni.webView && typeof window.uni.webView.postMessage === 'function') {
                    showBridgeStatus('验证码通过，正在回传 App…', false);
                    console.log('[AliyunCaptcha] 通过 uni.webView 回传校验参数');
                    window.uni.webView.postMessage({ data: captchaVerifyParam });
                    return;
                }

                // uni.webview 脚本会等待 plusready；桥接尚未就绪时短暂重试，避免丢失校验结果。
                if (currentRetryCount < 20) {
                    setTimeout(function() {
                        postCaptchaVerifyParamToApp(captchaVerifyParam, currentRetryCount + 1);
                    }, 100);
                    return;
                }

                console.error('[AliyunCaptcha] uni.webView 桥接未就绪，无法回传校验参数');
                showBridgeStatus('验证码通过，但 App 通信未就绪，请关闭后重试。', true);
            }

            function handleCaptchaSuccess(captchaVerifyParam) {
                if (captchaResultHandled) {
                    return;
                }
                captchaResultHandled = true;
                console.log('[AliyunCaptcha] 收到校验参数');
                // 微信小程序端：维持原有回传与返回逻辑。
                if (window.wx && window.wx.miniProgram) {
                    window.wx.miniProgram.postMessage({ data: captchaVerifyParam });
                    window.wx.miniProgram.navigateBack();
                    return;
                }

                // App 端：通过 uni-app x WebView 桥接将校验参数回传原生页面。
                postCaptchaVerifyParamToApp(captchaVerifyParam, 0);
            }

            // V3 架构在验证通过后调用 success。
            function success(captchaVerifyParam) {
                handleCaptchaSuccess(captchaVerifyParam);
            }

            // V2 架构使用 captchaVerifyCallback，并要求返回业务校验结果。
            function captchaVerifyCallback(captchaVerifyParam, callback) {
                handleCaptchaSuccess(captchaVerifyParam);
                var result = {
                    captchaResult: true,
                    bizResult: true,
                };
                if (typeof callback === 'function') {
                    callback(result);
                }
                return result;
            }

            function fail(err) {
                console.error(err);
            }
        </script>
    </body>
</html>
